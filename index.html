    <!-- Apply saved/OS theme BEFORE first paint to prevent dark-mode flash of white -->
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('loadsaathi-theme'); } catch (e) { /* storage may be blocked */ }
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', dark ? '#050816' : '#ea580c');
        } catch (e) {}
      })();
    </script>
